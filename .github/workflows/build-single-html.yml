name: Build single-file HTML

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build single-file app
        run: npm run build

      - name: Upload built HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-html-build
          path: dist/index.html
          if-no-files-found: error
