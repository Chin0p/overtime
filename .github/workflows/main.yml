name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-singlefile:
    uses: ./.github/workflows/build-singlefile.yml
    permissions:
      contents: read

  build-normal:
    uses: ./.github/workflows/build-normal.yml
    permissions:
      contents: read

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-normal
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      pages: write
      id-token: write

  tag-release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-singlefile
    uses: ./.github/workflows/tag-release.yml
    permissions:
      contents: write